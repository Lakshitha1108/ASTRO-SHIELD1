<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroHealth Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b132b;
        }

        .navbar {
            width: 100%;
            background: #101d3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .logo {
            color: #00d4ff;
            font-size: 23px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 5px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #00d4ff;
            border-bottom: 2px solid #00d4ff;
        }

        .logout {
            background: #e63946;
            color: white !important;
            padding: 10px 16px !important;
            border-radius: 6px;
        }

        .logout:hover {
            background: #c1121f;
        }

        .menu-btn {
            display: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
            background: none;
            border: none;
        }

        @media (max-width: 850px) {
            .menu-btn {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: #101d3a;
                flex-direction: column;
                padding: 20px;
                gap: 15px;
            }

            .nav-links.show {
                display: flex;
            }

            .navbar {
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚀 AstroHealth
        </div>

        <button class="menu-btn" onclick="toggleMenu()">
            ☰
        </button>

        <div class="nav-links" id="navLinks">

            <a href="index.html">Home</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="profile.html">Profile</a>

            <a href="analytics.html">Analytics</a>

            <a href="alerts.html">Alerts</a>

            <a href="doctor.html">Doctor</a>

            <a href="history.html">History</a>

            <a href="login.html" class="logout">Logout</a>

        </div>

    </nav>

    <script>
        function toggleMenu() {
            document.getElementById("navLinks")
            .classList.toggle("show");
        }

        const currentPage = window.location.pathname
            .split("/")
            .pop() || "index.html";

        document.querySelectorAll(".nav-links a")
        .forEach(link => {
            if (link.getAttribute("href") === currentPage) {
                link.classList.add("active");
            }
        });
    </script>

</body>
</html>
